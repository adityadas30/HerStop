# HerStop — Saved tab shows the guest sign-in invitation when signed out.
#
# clearState: true is deliberate here: this flow verifies the signed-out
# empty state, so it needs a clean session rather than whatever the previous
# flow left behind.
#
# Run with: maestro test --device <UDID> saved-tab.yaml
appId: host.exp.Exponent
name: HerStop Saved tab guest invitation
---
- launchApp:
    clearState: true

# See smoke.yaml for why this uses extendedWaitUntil + optional tapOn rather
# than `runFlow: when: visible` (that pattern raced ahead of the Expo Go home
# screen actually rendering and silently skipped a real element).
- extendedWaitUntil:
    visible: "HerStop"
    timeout: 8000
    optional: true
- tapOn:
    text: "HerStop"
    optional: true

- extendedWaitUntil:
    visible: "Get Started"
    timeout: 5000
    optional: true
- tapOn:
    text: "Get Started"
    optional: true

- tapOn: ".*Saved.*"
- assertVisible: "Saved Stops"
- assertVisible: "Save stops for later"
- assertVisible: "Sign in"
- assertNotVisible: "Verified safe"
- takeScreenshot: maestro-herstop-saved-guest
