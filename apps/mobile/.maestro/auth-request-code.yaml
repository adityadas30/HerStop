# HerStop — request an email OTP code (guest -> enter-code step).
#
# Phase A1 of a two-phase manual verification: this flow must tap "Send code"
# exactly once, because Supabase's default email sender rate-limits requests
# and a second send invalidates the first code. `auth-enter-code.yaml`
# deliberately does NOT call launchApp, so it continues from wherever this
# flow leaves the app rather than relaunching (which would drop the
# in-memory `step` state on the Profile screen back to "enter-email").
#
# Run with: maestro test --device <UDID> -e EMAIL=you@example.com auth-request-code.yaml
appId: host.exp.Exponent
name: HerStop request an OTP email code
---
- launchApp:
    clearState: false

# Maestro's launchApp relaunches Expo Go itself, not the last-opened project
# — it lands on Expo Go's home screen with a "Recently opened > HerStop" row.
# See smoke.yaml for why this uses extendedWaitUntil + optional tapOn rather
# than `runFlow: when: visible` (that pattern raced ahead of the Expo Go home
# screen actually rendering and silently skipped a real element).
- extendedWaitUntil:
    visible: "HerStop"
    timeout: 8000
    optional: true
- tapOn:
    text: "HerStop"
    optional: true

- extendedWaitUntil:
    visible: "Get Started"
    timeout: 5000
    optional: true
- tapOn:
    text: "Get Started"
    optional: true

- tapOn: ".*Profile.*"
- assertVisible: "Profile"

# Guard: if a previous run left this screen signed in or already on the
# enter-code step, fail loudly here instead of silently re-sending a code.
- assertVisible: "you@example.com"

- tapOn: "you@example.com"
- inputText: ${EMAIL}
- tapOn: "Send code"
- assertVisible: "Enter the code sent to your email"
- takeScreenshot: maestro-herstop-otp-request
