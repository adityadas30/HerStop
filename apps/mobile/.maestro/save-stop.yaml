# HerStop — browse a stop and save it (Level 3, guest path).
#
# Run with: maestro --device <UDID> test save-stop.yaml
#
# Guest saving only works from the Explore list. The bookmark on a stop card
# (testID `stop-card-bookmark-<id>`) saves in memory for guests. The bookmark on
# the detail screen (`stop-detail-bookmark`) sends a guest to sign in on
# Profile instead, so this flow does not use it. The signed-in path is covered
# by saved-persistence.yaml.
#
# Guest saves live in memory only, so the Saved tab should show the stop
# alongside the "Keep these stops" sign-in invitation.
#
# clearState: true is deliberate: the bookmark is a toggle, so a stop left saved
# by an earlier run would be unsaved by this one and fail the Saved-tab check.
appId: com.adityadas.herstop
name: HerStop open a stop and save it (guest path)
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Get Started"
    timeout: 30000
- tapOn: "Get Started"

- assertVisible: ".*Explore.*"

# Open the first stop card. The pattern skips `stop-card-bookmark-*` ids, which
# would otherwise also match "stop-card-.*".
- tapOn:
    id: "stop-card-(?!bookmark-).*"
    index: 0
- takeScreenshot: maestro-herstop-stop-detail

# The detail screen must describe reported experience, never assert safety.
- assertNotVisible: "Verified safe"
- assertNotVisible: "Guaranteed"
- tapOn: "Back"

# Save the first stop from its card bookmark, then confirm it in the Saved tab.
- tapOn:
    id: "stop-card-bookmark-.*"
    index: 0
- tapOn: "Saved, tab.*"
# The Saved tab mounts lazily on first visit, so wait rather than assert instantly.
- extendedWaitUntil:
    visible: "Saved Stops"
    timeout: 10000
- assertVisible: "Keep these stops"
- assertNotVisible: "No saved stops yet"
- takeScreenshot: maestro-herstop-saved
